<!-- @dsCard group="Type" viewport="700x190" subtitle="Nothing below 500 ever ships, secondary text goes lighter in colour, not weight" name="Weight floor" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="gap:20px;align-items:flex-end">
   <div style="flex:1"><div style="font-family:var(--font-display);font-weight:500;font-size:36px;letter-spacing:-0.02em">Aa</div>
     <div class="mono" style="margin-top:6px">500 Text</div></div><div style="flex:1"><div style="font-family:var(--font-display);font-weight:600;font-size:36px;letter-spacing:-0.02em">Aa</div>
     <div class="mono" style="margin-top:6px">600 Medium</div></div><div style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:36px;letter-spacing:-0.02em">Aa</div>
     <div class="mono" style="margin-top:6px">700 Bold</div></div><div style="flex:1"><div style="font-family:var(--font-display);font-weight:800;font-size:36px;letter-spacing:-0.02em">Aa</div>
     <div class="mono" style="margin-top:6px">800 Display</div></div><div style="flex:1"><div style="font-family:var(--font-display);font-weight:900;font-size:36px;letter-spacing:-0.02em">Aa</div>
     <div class="mono" style="margin-top:6px">900 Max</div></div>
   <div style="flex:1.4;border-left:1px solid var(--border-hairline);padding-left:18px">
     <div style="font-weight:400;font-size:20px;color:var(--ink-60);text-decoration:line-through">400 Regular</div>
     <div style="font-weight:300;font-size:20px;color:var(--ink-60);text-decoration:line-through">300 Light</div>
     <div class="mono" style="margin-top:8px;color:var(--status-error)">Not in the system</div>
   </div>
 </div></body></html>
