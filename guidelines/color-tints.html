<!-- @dsCard group="Colors" viewport="700x170" subtitle="Quiet background bands and selected states, never text" name="Accent tints" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row">
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sun-tint);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Sun tint</div>
   <div class="hex" style="margin-top:6px">#FFF2CC<br><span style="color:var(--ink-60)">--sun-tint</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--zest-tint);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Zest tint</div>
   <div class="hex" style="margin-top:6px">#FFE8D6<br><span style="color:var(--ink-60)">--zest-tint</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sky-tint);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Sky tint</div>
   <div class="hex" style="margin-top:6px">#E5EDFA<br><span style="color:var(--ink-60)">--sky-tint</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sprout-tint);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Sprout tint</div>
   <div class="hex" style="margin-top:6px">#E3F2E4<br><span style="color:var(--ink-60)">--sprout-tint</span></div></div>
 </div></body></html>
