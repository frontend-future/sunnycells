<!-- @startingPoint section="Ecommerce" subtitle="SUNNYCELLS desktop store: home, PLP, PDP, bag drawer" viewport="1440x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>SUNNYCELLS Store</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/_card.js"></script>
<script src="./data.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{min-width:1440px;font-family:var(--font-text);font-weight:var(--weight-text);font-size:var(--size-body);
       color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased;
       text-wrap:pretty}
  a{color:var(--text-link);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:4px}
  ::selection{background:var(--sun)}
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.mountDS('../../', ['Button', 'ProductCard', 'Price'], function () {
    var files = ['Chrome.jsx', 'Home.jsx', 'Listing.jsx', 'Product.jsx', 'App.jsx'];
    Promise.all(files.map(function (n) { return fetch(n).then(function (r) { return r.text(); }); }))
      .then(function (sources) {
        sources.forEach(function (src) {
          var out = Babel.transform(src, { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] }).code;
          (0, eval)(out);
        });
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.SCKit.App));
      })
      .catch(function (e) { console.error(e); document.body.textContent = String(e); });
  });
</script>
</body>
</html>
