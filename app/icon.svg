<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SUNNYCELLS">
  <!-- Black on the brand yellow, which is the only pairing the system allows on an
       accent. Ray weight is set for a 16px tab, not for how it looks at 512. -->
  <rect width="32" height="32" rx="7" fill="#FFC61E"/>
  <circle cx="16" cy="16" r="6.4" fill="#0D0D0C"/>
  <g stroke="#0D0D0C" stroke-width="3.2" stroke-linecap="round">
    <line x1="16" y1="2.8" x2="16" y2="6.4"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(45 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(90 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(135 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(180 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(225 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(270 16 16)"/>
    <line x1="16" y1="2.8" x2="16" y2="6.4" transform="rotate(315 16 16)"/>
  </g>
</svg>
