<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:17px;font-weight:600;line-height:1.4">
   <div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Gradients, mesh, or noise backgrounds</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Emoji, anywhere, ever</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Pill-shaped buttons</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>White text on yellow</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Font weights below 500</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Body copy below 20px</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Decimal prices</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Before / after imagery</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>Bounce, spring, or parallax motion</span></div><div style="display:flex;gap:10px;align-items:flex-start">
     <span style="color:var(--status-error);font-weight:800;flex:none">✕</span><span>“Anti-ageing”, “fix”, “flaw”, “babe”</span></div>
 </div></body></html>
