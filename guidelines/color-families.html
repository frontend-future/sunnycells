<!-- @dsCard group="Colors" viewport="700x210" subtitle="One hue per product family. Never decoration, never mixed in one card" name="Product family codes" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row">
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sun);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Ingestible</div>
   <div class="hex" style="margin-top:6px">#FFC61E<br><span style="color:var(--ink-60)">--sun</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--zest);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Topical</div>
   <div class="hex" style="margin-top:6px">#FF7A1A<br><span style="color:var(--ink-60)">--zest</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sky);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Hair</div>
   <div class="hex" style="margin-top:6px">#8CB0E8<br><span style="color:var(--ink-60)">--sky</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--sprout);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Wellness</div>
   <div class="hex" style="margin-top:6px">#79C47E<br><span style="color:var(--ink-60)">--sprout</span></div></div>
 </div>
 <div style="margin-top:14px;font-size:15px;font-weight:600;color:var(--ink-60);line-height:1.45">
   Applied as a flat block behind the product cutout, and optionally as that card's add-to-bag fill.
   Two family colours never appear inside one card.</div></body></html>
