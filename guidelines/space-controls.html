<!-- @dsCard group="Spacing" viewport="700x185" subtitle="Hit targets never below 48px, above the 44 minimum, on purpose" name="Control heights" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="align-items:flex-end;gap:16px">
   <div style="flex:1"><div style="height:48px;background:var(--ink);color:var(--white);border-radius:var(--radius-button);
     display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;font-size:17px">ADD TO BAG</div>
     <div class="mono" style="margin-top:8px">Small · 48px</div></div><div style="flex:1"><div style="height:56px;background:var(--ink);color:var(--white);border-radius:var(--radius-button);
     display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;font-size:17px">ADD TO BAG</div>
     <div class="mono" style="margin-top:8px">Medium · 56px</div></div><div style="flex:1"><div style="height:64px;background:var(--ink);color:var(--white);border-radius:var(--radius-button);
     display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.08em;font-size:17px">ADD TO BAG</div>
     <div class="mono" style="margin-top:8px">Large · 64px</div></div>
 </div></body></html>
