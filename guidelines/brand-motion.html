<!-- @dsCard group="Brand" viewport="700x215" subtitle="Calm and quick. No bounce, no spring, no parallax." name="Motion & states" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="gap:20px">
   <div style="flex:1.1">
     <div style="display:flex;justify-content:space-between;font-size:17px;font-weight:600;padding:5px 0;border-bottom:1px solid var(--border-hairline)">
       <span>Hover</span><span class="mono" style="color:var(--ink)">160ms</span></div><div style="display:flex;justify-content:space-between;font-size:17px;font-weight:600;padding:5px 0;border-bottom:1px solid var(--border-hairline)">
       <span>Panel</span><span class="mono" style="color:var(--ink)">240ms</span></div><div style="display:flex;justify-content:space-between;font-size:17px;font-weight:600;padding:5px 0;border-bottom:1px solid var(--border-hairline)">
       <span>Sheet</span><span class="mono" style="color:var(--ink)">380ms</span></div>
     <div class="mono" style="margin-top:10px">cubic-bezier(.2,0,0,1)</div>
   </div>
   <div style="flex:1.4;display:flex;flex-direction:column;gap:8px">
     <div class="mono">Button states</div>
     <div style="display:flex;gap:8px">
       <div style="flex:1;height:48px;background:var(--ink);color:var(--white);border-radius:var(--radius-button);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.08em">REST</div>
       <div style="flex:1;height:48px;background:var(--ink-80);color:var(--white);border-radius:var(--radius-button);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.08em">HOVER</div>
       <div style="flex:1;height:48px;background:var(--ink-80);color:var(--white);border-radius:var(--radius-button);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.08em;transform:scale(.985)">PRESS</div>
       <div style="flex:1;height:48px;background:var(--action-disabled-bg);color:var(--action-disabled-fg);border-radius:var(--radius-button);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.08em">OFF</div>
     </div>
     <div style="font-size:15px;font-weight:600;color:var(--ink-60)">Press adds scale(0.985). Links underline on hover, never change colour.</div>
   </div>
 </div></body></html>
