<!-- @dsCard group="Colors" viewport="700x190" subtitle="Warm black-and-white foundation, 90% of every screen" name="Base neutrals" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row">
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--white);font-weight:700;font-size:13px">Ink</div>
   <div class="hex" style="margin-top:6px">#0D0D0C<br><span style="color:var(--ink-60)">--ink</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink-80);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--white);font-weight:700;font-size:13px">Ink 80</div>
   <div class="hex" style="margin-top:6px">#38382F<br><span style="color:var(--ink-60)">--ink-80</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink-60);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--white);font-weight:700;font-size:13px">Ink 60</div>
   <div class="hex" style="margin-top:6px">#6B6B60<br><span style="color:var(--ink-60)">--ink-60</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink-40);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--white);font-weight:700;font-size:13px">Ink 40</div>
   <div class="hex" style="margin-top:6px">#9B9B90<br><span style="color:var(--ink-60)">--ink-40</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink-20);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Ink 20</div>
   <div class="hex" style="margin-top:6px">#D8D6CE<br><span style="color:var(--ink-60)">--ink-20</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--ink-10);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Ink 10</div>
   <div class="hex" style="margin-top:6px">#EAE8E1<br><span style="color:var(--ink-60)">--ink-10</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--shell);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">Shell</div>
   <div class="hex" style="margin-top:6px">#F7F5F0<br><span style="color:var(--ink-60)">--shell</span></div></div>
   <div style="flex:1"><div style="height:76px;border-radius:var(--radius-md);background:var(--white);
   border:1px solid var(--border-hairline);display:flex;align-items:flex-end;padding:8px 10px;
   color:var(--ink);font-weight:700;font-size:13px">White</div>
   <div class="hex" style="margin-top:6px">#FFFFFF<br><span style="color:var(--ink-60)">--white</span></div></div>
 </div></body></html>
