<!-- @dsCard group="Spacing" viewport="700x200" subtitle="1360px max · 48px gutters · 24px grid gap · 112px section rhythm" name="Layout grid" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div style="border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:14px;background:var(--shell)">
   <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:12px;height:88px">
     <div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div><div style="background:var(--sun-tint);border:1px solid var(--sun);border-radius:4px"></div>
   </div>
 </div>
 <div class="row" style="margin-top:12px;gap:28px">
   <div><div class="mono">Max width</div><div style="font-weight:700;font-size:18px">1360px</div></div><div><div class="mono">Gutter</div><div style="font-weight:700;font-size:18px">48 / 20px</div></div><div><div class="mono">Grid gap</div><div style="font-weight:700;font-size:18px">24px</div></div><div><div class="mono">Section gap</div><div style="font-weight:700;font-size:18px">112 / 64px</div></div>
 </div></body></html>
