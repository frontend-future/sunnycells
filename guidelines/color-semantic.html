<!-- @dsCard group="Colors" viewport="700x230" subtitle="Use these, not the raw hues, when building components" name="Semantic aliases" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;font-size:15px;font-weight:600">
   <div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--text-primary</span>
     <span class="hex" style="margin-left:auto">--ink</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--white);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--surface-page</span>
     <span class="hex" style="margin-left:auto">--white</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink-60);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--text-secondary</span>
     <span class="hex" style="margin-left:auto">--ink-60</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--shell);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--surface-sunk</span>
     <span class="hex" style="margin-left:auto">--shell</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--white);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--text-inverse</span>
     <span class="hex" style="margin-left:auto">--white</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--surface-invert</span>
     <span class="hex" style="margin-left:auto">--ink</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink-20);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--border-hairline</span>
     <span class="hex" style="margin-left:auto">--ink-20</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--sun-tint);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--surface-highlight</span>
     <span class="hex" style="margin-left:auto">--sun-tint</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--action-primary-bg</span>
     <span class="hex" style="margin-left:auto">--ink</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--sun);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--action-accent-bg</span>
     <span class="hex" style="margin-left:auto">--sun</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--border-focus</span>
     <span class="hex" style="margin-left:auto">--ink</span></div><div style="display:flex;align-items:center;gap:10px">
     <span style="width:22px;height:22px;border-radius:6px;background:var(--ink-10);border:1px solid var(--border-hairline);flex:none"></span>
     <span class="mono" style="font-size:12.5px;color:var(--ink)">--action-disabled-bg</span>
     <span class="hex" style="margin-left:auto">--ink-10</span></div>
 </div></body></html>
