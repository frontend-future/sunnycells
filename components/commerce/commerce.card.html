<!-- @dsCard group="Components" viewport="1000x1000" subtitle="Product card, subscription buy box, price, star rating" name="Commerce" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/_card.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .lbl{font-family:var(--font-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
       color:var(--ink-60);margin-bottom:10px}
  .grp{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .stack{display:flex;flex-direction:column;gap:18px}
</style></head>
<body><div id="root"></div>
<script type="text/plain" id="sc-demo">
function Demo() {
  const [cadence, setCadence] = React.useState('30');
  const plans = [
    { id: '30', label: 'Every month', price: 39, note: 'One bottle, 30 servings', flag: 'Most chosen', per: 'per month' },
    { id: '60', label: 'Every 2 months', price: 37, note: 'Two bottles, 60 servings', per: 'per month' },
    { id: '90', label: 'Every 3 months', price: 35, note: 'Three bottles, 90 servings', per: 'per month' }
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 32, alignItems: 'start' }}>
      <div className="stack">
        <div>
          <div className="lbl">Product card</div>
          <ProductCard family="ingestible" name="SC-12 Liquid Collagen" subtitle="Types I + III + vitamin C"
            flavor="Mango" price={39} compareAt={49} rating={4.7} reviewCount={12480} badge="Bestseller" blockHeight={200} />
        </div>
        <div>
          <div className="lbl">Price · integers only</div>
          <div className="grp" style={{ gap: 32, alignItems: 'flex-end' }}>
            <Price value={49} size="lg" />
            <Price value={39} compareAt={49} size="md" />
          </div>
        </div>
        <div>
          <div className="lbl">Star rating</div>
          <StarRating value={4.7} count={12480} showValue />
        </div>
        <div>
          <div className="lbl">Offer flag · the one percentage in the brand</div>
          <div className="grp">
            <OfferFlag />
            <OfferFlag tone="sun" size="sm" />
          </div>
        </div>
      </div>
      <div>
        <div className="lbl">Subscription box · cadence only, no one-time</div>
        <SubscriptionBox compareAt={49} value={cadence} onChange={setCadence} plans={plans} />
      </div>
    </div>
  );
}
</script>
<script>mountCard('../../', ["ProductCard","Price","StarRating","SubscriptionBox","OfferFlag"]);</script></body></html>
