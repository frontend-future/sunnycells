<!-- @dsCard group="Spacing" viewport="700x175" subtitle="4px grid, large steps are the common ones" name="Space scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="align-items:flex-end;gap:10px">
   <div style="text-align:center"><div style="width:4px;height:4px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">64</div></div><div style="text-align:center"><div style="width:80px;height:80px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">80</div></div><div style="text-align:center"><div style="width:96px;height:88px;background:var(--sun);border-radius:4px"></div>
     <div class="mono" style="margin-top:6px;font-size:11px">96</div></div>
 </div></body></html>
