<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="gap:16px;padding:6px 4px 16px">
   <div style="flex:1;text-align:center">
     <div style="height:80px;background:var(--white);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:none"></div>
     <div style="margin-top:10px;font-weight:700;font-size:15px">Rest</div></div><div style="flex:1;text-align:center">
     <div style="height:80px;background:var(--white);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-card)"></div>
     <div style="margin-top:10px;font-weight:700;font-size:15px">Card hover</div></div><div style="flex:1;text-align:center">
     <div style="height:80px;background:var(--white);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-raised)"></div>
     <div style="margin-top:10px;font-weight:700;font-size:15px">Raised</div></div><div style="flex:1;text-align:center">
     <div style="height:80px;background:var(--white);border:1px solid var(--border-hairline);border-radius:var(--radius-card);box-shadow:var(--shadow-focus)"></div>
     <div style="margin-top:10px;font-weight:700;font-size:15px">Focus</div></div>
 </div></body></html>
