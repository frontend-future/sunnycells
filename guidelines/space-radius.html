<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Soft, never bubbly. Pills are for tags only" name="Corner radii" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-text);font-weight:var(--weight-text);color:var(--text-primary);
       background:var(--surface-page);padding:20px 24px;-webkit-font-smoothing:antialiased}
  .row{display:flex;gap:var(--space-3);align-items:stretch}
  .col{display:flex;flex-direction:column;gap:var(--space-2)}
  .mono{font-family:var(--font-label);font-size:12px;letter-spacing:var(--tracking-mono);
        color:var(--ink-60)}
  .hex{font-family:var(--font-label);font-size:12px;color:var(--ink-60)}
</style></head><body><div class="row" style="gap:14px">
   <div style="flex:1;text-align:center">
     <div style="height:84px;background:var(--shell);border:2px solid var(--ink);border-radius:var(--radius-button)"></div>
     <div style="margin-top:8px;font-weight:700;font-size:15px">Button</div>
     <div class="hex">12px</div></div><div style="flex:1;text-align:center">
     <div style="height:84px;background:var(--shell);border:2px solid var(--ink);border-radius:var(--radius-input)"></div>
     <div style="margin-top:8px;font-weight:700;font-size:15px">Input</div>
     <div class="hex">10px</div></div><div style="flex:1;text-align:center">
     <div style="height:84px;background:var(--shell);border:2px solid var(--ink);border-radius:var(--radius-card)"></div>
     <div style="margin-top:8px;font-weight:700;font-size:15px">Card</div>
     <div class="hex">16px</div></div><div style="flex:1;text-align:center">
     <div style="height:84px;background:var(--shell);border:2px solid var(--ink);border-radius:var(--radius-sheet)"></div>
     <div style="margin-top:8px;font-weight:700;font-size:15px">Sheet</div>
     <div class="hex">20px</div></div><div style="flex:1;text-align:center">
     <div style="height:84px;background:var(--shell);border:2px solid var(--ink);border-radius:var(--radius-tag)"></div>
     <div style="margin-top:8px;font-weight:700;font-size:15px">Tag</div>
     <div class="hex">pill</div></div>
 </div>
 <div style="margin-top:12px;font-size:15px;font-weight:600;color:var(--ink-60)">A pill-shaped button is off-brand.</div></body></html>
